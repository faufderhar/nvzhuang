# 接口安全与访问控制配置
security:
  authRequired: true                # 是否强制 Bearer Token 访问鉴权。本地调试可设为 false，线上部署必须为 true
  apiKeysEnv: "TRYON_API_KEYS"      # 读取有效后端 Token 的环境变量名（多 Token 以英文逗号分隔，每个 32~512 字符）
  trustedOrigins:                   # CORS 严格白名单（精确匹配，禁止 *）
    - "https://paipiange.github.io"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allowPrivateNetwork: false        # 是否允许来自私有网络的 PNA 预检
  trustedProxies: []                # 可信反向代理 IP/CIDR（宿主机 Nginx 填 ["127.0.0.1/32"]；Docker 部署只填代理容器的 /32，如 deploy/ 中的 ["172.30.0.2/32"]，不要填网关或整个网段）。仅这些地址转发的 X-Forwarded-For 才会被采信；为空时只用 TCP 对端地址做限流
  clientModelAllowedPorts: [443]    # 浏览器自定义模型 Base URL 允许的 HTTPS 端口（默认仅 443）。中转站使用 8443 等端口时可追加，仍强制 HTTPS 与公网地址校验
  # 浏览器自定义模型（个人 Key）Base URL 允许的域名白名单。规则为精确主机名，或 "*.example.com"（匹配任意子域名，不含 example.com 本身）；
  # 不支持单独的 "*"、协议、端口或路径。不写或写空列表时使用下面三个官方默认值；上方 llm.models 中 HTTPS baseURL 的域名会在启动时自动追加。
  # 不在白名单内的地址返回 400“Base URL 的域名不在服务端允许的模型服务列表中”。白名单之外仍强制 HTTPS、端口白名单与公网地址校验。
  clientModelAllowedHosts:
    - "api.openai.com"
    - "ark.cn-beijing.volces.com"
    - "generativelanguage.googleapis.com"
  stateDir: ""                      # 每日额度持久化目录（bbolt 单文件 quota.db，只存主体哈希与计数）。为空表示纯内存、重启清零；Docker 生产建议 "/app/data"（配合 compose 的 tryon-state 卷）。目录不可用时启动失败
  rateLimit:
    requestsPerMinute: 10           # 单调用方每分钟请求速率上限
    burst: 3                        # 允许短时间突发容量
    limiterIdleMinutes: 30          # 限流器闲置自动清理周期（分钟）
    dailyRequestsPerPrincipal: 100  # 单调用方每日最高调用成功额度（自然日重置）
  concurrency:
    global: 2                       # 全局最大生图并发数（4c24g 生产建议 6，配合 GOMEMLIMIT=2GiB、容器内存上限 3GiB）
    perPrincipal: 1                 # 单调用方最大生图并发数
    queueTimeoutSeconds: 0          # 全局并发已满时的排队秒数（0–60）。0 为立即返回 429；生产建议 10。超时返回 429 并带 Retry-After

# 请求体与图片安全限制
upload:
  maxRequestBodyBytes: 25165824     # 整个 HTTP JSON 请求体最大字节数（24 MiB）
  maxEncodedImageBytes: 12582912    # 单张 Base64 编码字符串最大长度（12 MiB）
  maxDecodedImageBytes: 8388608     # 单张图片解码后真实文件大小上限（8 MiB）
  maxCombinedDecodedBytes: 16777216 # 两张图片（人像+服装）解码后合计字节上限（16 MiB）
  minWidth: 256                     # 图片最小宽度（像素）
  minHeight: 256                    # 图片最小高度（像素）
  maxWidth: 8192                    # 图片最大宽度（像素）
  maxHeight: 8192                   # 图片最大高度（像素）
  maxPixels: 20000000               # 单图最大像素总量（2000万像素，防内存耗尽）
  allowedMimeTypes:                 # 允许的真实图片格式
    - "image/jpeg"
    - "image/png"
    - "image/webp"

# 配置数据库
# database:
#   default:
#   - link: "mysql:root:12345678@tcp(127.0.0.1:3306)/test"
# database:
#   分组名称:
#     host:                  "地址"
#     port:                  "端口"
#     user:                  "账号"
#     pass:                  "密码"
#     name:                  "数据库名称"
#     type:                  "数据库类型(如：mariadb/tidb/mysql/pgsql/mssql/sqlite/oracle/clickhouse/dm)"
#     link:                  "(可选)自定义数据库链接信息，当该字段被设置值时，以上链接字段(Host,Port,User,Pass,Name)将失效，但是type必须有值"         
#     extra:                 "(可选)不同数据库的额外特性配置，由底层数据库driver定义"
#     role:                  "(可选)数据库主从角色(master/slave)，不使用应用层的主从机制请均设置为master"
#     debug:                 "(可选)开启调试模式"
#     prefix:                "(可选)表名前缀"
#     dryRun:                "(可选)ORM空跑(只读不写)"
#     charset:               "(可选)数据库编码(如: utf8/gbk/gb2312)，一般设置为utf8"
#     protocol:              "(可选)数据库连接协议，默认为TCP"
#     weight:                "(可选)负载均衡权重，用于负载均衡控制，不使用应用层的负载均衡机制请置空"
#     timezone:              "(可选)时区配置，例如:Local"
#     namespace:             "(可选)用以支持个别数据库服务Catalog&Schema区分的问题，原有的Schema代表数据库名称，而NameSpace代表个别数据库服务的Schema"
#     maxIdle:               "(可选)连接池最大闲置的连接数(默认10)"
#     maxOpen:               "(可选)连接池最大打开的连接数(默认无限制)"
#     maxLifetime:           "(可选)连接对象可重复使用的时间长度(默认30秒)"
#     queryTimeout:          "(可选)查询语句超时时长(默认无限制，注意ctx的超时时间设置)"
#     execTimeout:           "(可选)写入语句超时时长(默认无限制，注意ctx的超时时间设置)"
#     tranTimeout:           "(可选)事务处理超时时长(默认无限制，注意ctx的超时时间设置)"
#     prepareTimeout:        "(可选)预准备SQL语句执行超时时长(默认无限制，注意ctx的超时时间设置)"
#     createdAt:             "(可选)自动创建时间字段名称"
#     updatedAt:             "(可选)自动更新时间字段名称"
#     deletedAt:             "(可选)软删除时间字段名称"
#     timeMaintainDisabled:  "(可选)是否完全关闭时间更新特性，true时CreatedAt/UpdatedAt/DeletedAt都将失效"
